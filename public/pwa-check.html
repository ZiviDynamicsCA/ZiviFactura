<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F8FBFF" />
  <link rel="manifest" href="/manifest.webmanifest?v=43" />
  <link rel="icon" href="/zivifactura-app-512-v43.png?v=43" type="image/png" />
  <title>Diagnóstico PWA | ZiviFactura</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f9ff;color:#102348}.wrap{width:min(100%,760px);margin:auto;padding:24px 14px 44px}.card{background:#fff;border:1px solid #dce8f5;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 12px 34px rgba(25,71,127,.07)}h1{margin:0 0 7px;font-size:1.65rem}p{color:#66799a;line-height:1.5}.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid #edf3f9}.row:first-child{border-top:0}.row strong{font-size:.9rem}.row span{text-align:right;font-size:.82rem;font-weight:800}.ok{color:#087a52}.bad{color:#b42318}.wait{color:#9a6700}.buttons{display:grid;gap:9px}.buttons button,.buttons a{min-height:48px;border-radius:14px;border:0;text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:850}.primary{background:linear-gradient(135deg,#00dff5,#079cff 58%,#1267ed);color:#fff}.secondary{background:#eef6ff;color:#126bd9;border:1px solid #d4e8fa!important}.small{font-size:.75rem;color:#7a8ca7}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f7faff;border:1px solid #e1ebf5;border-radius:12px;padding:10px;font-size:.72rem;overflow-wrap:anywhere;white-space:pre-wrap}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>Diagnóstico de instalación</h1>
    <p>Valida manifest, service worker e íconos reales 192×192 y 512×512 de ZiviFactura.</p>
    <div style="display:flex;align-items:center;gap:16px;margin-top:14px">
      <img src="/zivifactura-app-192-v43.png?v=43" alt="Ícono exacto de instalación v43" style="width:80px;height:80px;border-radius:18px;box-shadow:0 12px 26px rgba(18,103,237,.18);border:1px solid #d7e6f6" />
      <strong style="font-size:1.2rem">Ícono exacto de instalación v43</strong>
    </div>
  </section>
  <section class="card" id="checks"></section>
  <section class="card buttons">
    <button id="install" class="primary" disabled>Instalar ZiviFactura</button>
    <button id="refresh" class="secondary">Volver a comprobar</button>
    <a class="secondary" href="/">Volver a ZiviFactura</a>
    <p class="small">Si acabas de desplegar, abre esta página en modo incógnito o limpia el sitio para evitar caché anterior.</p>
  </section>
  <section class="card"><strong>Detalle técnico</strong><div id="detail" class="code">Preparando…</div></section>
</main>
<script>
  let deferredPrompt = null
  const rows = []
  const checks = document.getElementById('checks')
  const detail = document.getElementById('detail')
  const install = document.getElementById('install')
  const add = (name, value, state = 'wait') => rows.push({ name, value, state })
  const render = () => { checks.innerHTML = rows.map(r => `<div class="row"><strong>${r.name}</strong><span class="${r.state}">${r.value}</span></div>`).join('') }

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault()
    deferredPrompt = event
    install.disabled = false
    void run()
  })
  window.addEventListener('appinstalled', () => {
    deferredPrompt = null
    install.disabled = true
    void run()
  })
  install.addEventListener('click', async () => {
    if (!deferredPrompt) return
    await deferredPrompt.prompt()
    await deferredPrompt.userChoice.catch(() => null)
    deferredPrompt = null
    install.disabled = true
    void run()
  })
  document.getElementById('refresh').addEventListener('click', () => void run())

  function imageSize(src) {
    return new Promise(resolve => {
      const img = new Image()
      img.onload = () => resolve(`${img.naturalWidth}×${img.naturalHeight}`)
      img.onerror = () => resolve('ERROR')
      img.src = `${src}${src.includes('?') ? '&' : '?'}check=${Date.now()}`
    })
  }

  async function run() {
    rows.length = 0
    add('HTTPS / contexto seguro', window.isSecureContext ? 'Correcto' : 'No seguro', window.isSecureContext ? 'ok' : 'bad')
    add('Service Worker soportado', 'serviceWorker' in navigator ? 'Sí' : 'No', 'serviceWorker' in navigator ? 'ok' : 'bad')

    let sw = 'No registrado'
    let scope = '—'
    try {
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
        await reg.update().catch(() => {})
        await navigator.serviceWorker.ready
        sw = 'Registrado'
        scope = reg.scope
      }
    } catch (error) {
      sw = `ERROR: ${error?.message || error}`
    }
    add('Service Worker', sw, sw === 'Registrado' ? 'ok' : 'bad')
    add('Scope del Worker', scope, scope.includes(location.origin) ? 'ok' : 'wait')

    let manifestData = null
    try {
      const res = await fetch(`/manifest.webmanifest?check=${Date.now()}`, { cache: 'no-store' })
      manifestData = await res.json()
      add('Manifest', res.ok ? 'Disponible' : 'Error HTTP', res.ok ? 'ok' : 'bad')
      add('Nombre', manifestData.name || manifestData.short_name || 'Falta', manifestData.name || manifestData.short_name ? 'ok' : 'bad')
      add('start_url', manifestData.start_url || 'Falta', manifestData.start_url ? 'ok' : 'bad')
      add('display', manifestData.display || 'Falta', ['standalone','fullscreen','minimal-ui','window-controls-overlay'].includes(manifestData.display) ? 'ok' : 'bad')
      const i192 = (manifestData.icons || []).find(i => String(i.sizes).includes('192x192'))
      const i512 = (manifestData.icons || []).find(i => String(i.sizes).includes('512x512'))
      const s192 = i192 ? await imageSize(i192.src) : 'Falta'
      const s512 = i512 ? await imageSize(i512.src) : 'Falta'
      add('Icono 192×192', s192, s192 === '192×192' ? 'ok' : 'bad')
      add('Icono 512×512', s512, s512 === '512×512' ? 'ok' : 'bad')
    } catch (error) {
      add('Manifest', `ERROR: ${error?.message || error}`, 'bad')
    }

    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
    add('Ya instalada', standalone ? 'Sí' : 'No', standalone ? 'ok' : 'wait')
    add('Prompt instalable', deferredPrompt ? 'Disponible' : 'Aún no emitido', deferredPrompt ? 'ok' : 'wait')
    install.disabled = !deferredPrompt
    detail.textContent = JSON.stringify({ manifest: manifestData, serviceWorker: { sw, scope }, beforeinstallprompt: Boolean(deferredPrompt), standalone, userAgent: navigator.userAgent }, null, 2)
    render()
  }
  void run()
</script>
</body>
</html>
